server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = / { try_files /_seo/home.html =404; }
  location = /rules { try_files /_seo/rules.html =404; }
  location = /privacy { try_files /_seo/privacy.html =404; }
  location = /cookies { try_files /_seo/cookies.html =404; }
  location = /login { try_files /_seo/login.html =404; }
  location = /register { try_files /_seo/register.html =404; }
  location = /verify-email { try_files /_seo/verify-email.html =404; }
  location = /forgot-password { try_files /_seo/forgot-password.html =404; }
  location = /reset-password { try_files /_seo/reset-password.html =404; }
  location ^~ /_seo/ { internal; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
