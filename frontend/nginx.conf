map $request_uri $rps_route_shell {
  default "";
  include /usr/share/nginx/html/_seo/nginx-routes.map;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  # Choose app routes before normalized locations: an encoded username can
  # contain ../assets without referring to a static asset in React Router.
  if ($rps_route_shell != "") { rewrite ^ /_rps-app-shell last; }
  location = /_rps-app-shell {
    internal;
    try_files $rps_route_shell =404;
  }

  error_page 404 /_seo/not-found.html;
  location ^~ /_seo/ { internal; }

  location ^~ /assets/ {
    try_files $uri =404;
  }
  location ^~ /sounds/ {
    try_files $uri =404;
  }

  location ~ ^/(robots\.txt|sitemap\.xml|site\.webmanifest|favicon\.(ico|svg))$ {
    try_files $uri =404;
  }

  location / {
    return 404;
  }
}
