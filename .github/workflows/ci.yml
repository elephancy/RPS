name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Install backend deps
        run: npm --prefix backend ci

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=high

      - name: Audit frontend production dependencies
        run: npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Audit backend dependencies
        run: npm --prefix backend audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Test backend and patched mail transport
        run: npm --prefix backend test

      - name: Load backend modules
        run: node -e "require('./backend/controllers/authController'); require('./backend/controllers/gameController'); require('./backend/controllers/economyController'); require('./backend/routes/auth'); require('./backend/routes/games'); require('./backend/routes/economy'); console.log('backend modules loaded')"

      - name: Validate private deployment boundary
        run: npm run test:deployment
