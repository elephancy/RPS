name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  lint-and-build:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Install backend deps
        run: npm --prefix backend ci

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --include=dev --audit-level=high

      - name: Audit backend dependencies
        run: npm --prefix backend audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install browser for route regression
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Verify initial metadata through Nginx
        run: |
          set -euo pipefail
          docker run -d --name rps-seo-smoke -p 127.0.0.1:18765:80 \
            -v "$PWD/frontend/build:/usr/share/nginx/html:ro" \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine
          trap 'docker rm -f rps-seo-smoke' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18765/ >/dev/null; then break; fi
            sleep 1
          done
          node frontend/scripts/smoke-initial-metadata.mjs
          node frontend/scripts/smoke-browser-routes.mjs

      - name: Test backend and patched mail transport
        run: npm --prefix backend test -- --coverage
      - name: Preserve mail transport coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-rps-mailer
          path: backend/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7
      - name: Upload mail transport coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CODECOV_UPLOAD_ENABLED == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: false
          files: ./backend/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          version: v11.3.1
          cleanup: true

      - name: Load backend modules
        run: node -e "require('./backend/controllers/authController'); require('./backend/controllers/gameController'); require('./backend/controllers/economyController'); require('./backend/routes/auth'); require('./backend/routes/games'); require('./backend/routes/economy'); console.log('backend modules loaded')"

      - name: Validate private deployment boundary
        run: npm run test:deployment
